; 本文件的存在本身就是修复：把 pytest 的 rootdir 锚定在 tests/ 目录。
;
; 原因：插件根目录名含连字符（ComfyUI-OpenAPI）且带 __init__.py。若 rootdir
; 停留在插件根，pytest 8.x 会为根目录创建 Package 节点并在每个测试 setup 前
; 导入根 __init__.py —— 无论 prepend 还是 importlib 导入模式，该文件都会因
; 连字符目录名得到退化包名（如 "__init__"），相对导入必然失败（91 errors）。
;
; rootdir 锚定到 tests/ 后，收集树从 tests/ 开始，根包永不被 pytest 导入；
; tests/ 无 __init__.py，prepend 模式自动将 tests/ 注入 sys.path，
; mock_openai_server 扁平导入与 conftest.py 的 cfoapi 合成包机制照旧工作。
;
; 使用约定：始终显式传入测试路径运行（在插件根目录执行）：
;     python -m pytest tests -q
; 不要运行不带参数的裸 pytest（会以插件根为 rootdir 触发上述 Package 问题）。
[pytest]
